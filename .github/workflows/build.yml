name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest  # أو ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build
        run: make package
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: ./packages/*.deb